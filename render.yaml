services:
  - type: web
    name: kibot
    runtime: python
    buildCommand: pip install -r requirements.txt -r requirements-web.txt
    startCommand: python main.py
    envVars:
      - key: WEB_ENABLED
        value: "1"
      - key: WEB_HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: WEB_PUBLIC_URL
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: WEB_SESSION_SECRET
        sync: false
      - key: BOT_INVITE_URL
        sync: false
