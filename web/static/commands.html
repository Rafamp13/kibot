<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comandos — Kibot</title><link rel="stylesheet" href="/static/styles.css"></head><body><div class="container"><nav class="nav"><a class="brand" href="/">KI<span>BOT</span></a><div class="navlinks"><a href="/">Início</a><a href="/dashboard">Dashboard</a></div></nav><section class="section"><div class="eyebrow">Central de comandos</div><h1>O arsenal do Kibot.</h1><p>Comandos principais organizados por categoria.</p><div class="toolbar"><input id="search" class="input" placeholder="Pesquisar comando..." oninput="filterCommands()"></div><div id="list" class="command-list"></div></section></div><script>let all=[];async function init(){all=(await (await fetch('/api/commands')).json()).commands;render(all)}function render(xs){document.getElementById('list').innerHTML=xs.map(c=>`<article class="card command"><code>K!${c.name}</code><span class="pill">${c.category}</span><p class="muted">${c.description}</p></article>`).join('')}function filterCommands(){const q=document.getElementById('search').value.toLowerCase();render(all.filter(c=>(c.name+' '+c.category+' '+c.description).toLowerCase().includes(q)))}init()</script></body></html>
